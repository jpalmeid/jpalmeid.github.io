<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Holiday Baking Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --surface-2:#E9F0EC; --surface-3:#D8E5DE;
  --ink:#10291F; --ink-2:#5A7466; --line:#D6E1DB; --line-strong:#AFC3B7;
  --spruce:#1B5E42; --spruce-ink:#FFFFFF; --pepper:#C9372C; --pepper-ink:#FFFFFF;
  --sugar:#E3AF3E; --frost:#D4E4EB;
  --p1:#C9372C; --p1-soft:#FBE9E6; --p2:#2A77AD; --p2-soft:#E2EEF6;
  --board:#143D2B; --board-2:#1C4D38; --board-ink:#FBF4E4; --board-muted:#A9C7B6;
  --ok:#2E7D4F; --bad:#B23B2F;
  --r:14px; --rs:10px; --nav-h:62px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1F17; --surface:#15302A; --surface-2:#1C3D33; --surface-3:#264C40; --ink:#F4EFE3; --ink-2:#A3BDB0; --line:#2B4F42; --line-strong:#3F6A58;
  --spruce:#49B284; --spruce-ink:#0B2A1E; --pepper:#E8604F; --pepper-ink:#1A0E0C; --sugar:#F0C65A; --frost:#214652;
  --p1:#E8604F; --p1-soft:#4A2622; --p2:#6DB5E6; --p2-soft:#1E3A4E; --board:#0E2D21; --board-2:#163B2D; --ok:#6FD39A; --bad:#F08A7E; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0C1F17; --surface:#15302A; --surface-2:#1C3D33; --surface-3:#264C40; --ink:#F4EFE3; --ink-2:#A3BDB0; --line:#2B4F42; --line-strong:#3F6A58;
  --spruce:#49B284; --spruce-ink:#0B2A1E; --pepper:#E8604F; --pepper-ink:#1A0E0C; --sugar:#F0C65A; --frost:#214652;
  --p1:#E8604F; --p1-soft:#4A2622; --p2:#6DB5E6; --p2-soft:#1E3A4E; --board:#0E2D21; --board-2:#163B2D; --ok:#6FD39A; --bad:#F08A7E; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{margin:0;line-height:1.15}
.display{font-family:"Alfa Slab One","Rockwell","Georgia",serif;font-weight:400;letter-spacing:.01em}
p{margin:0 0 .65em}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-visible{outline:3px solid var(--sugar);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
@media (min-width:700px){.wrap{padding:0 20px}}

/* masthead */
.masthead{padding:14px 0 2px}
.kicker{font-weight:700;color:var(--ink-2);font-size:12.5px;margin:0 0 2px}
.masthead h1{font-size:clamp(22px,5.6vw,30px)}
.board{margin:12px 0 10px;background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:12px 12px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.board .vs{display:grid;grid-template-columns:1fr 12px 1fr;align-items:stretch;gap:8px}
.board .side{text-align:center;padding:4px;border-radius:10px}
.board .side.lead{background:var(--board-2)}
.board .nm{font-weight:800;font-size:13.5px;color:var(--board-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .side.lead .nm{color:var(--board-ink)}
.board .tot{font-size:clamp(36px,11vw,52px);line-height:1;margin-top:2px}
.board .side.lead .tot{color:var(--sugar)}
.board .cane{width:8px;margin:0 auto;border-radius:6px;background:repeating-linear-gradient(135deg,#F3E8D3 0 8px,#C9372C 8px 16px)}
.board .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--board-muted)}
.board .flakes{display:flex;gap:4px}
.board .flakes span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);display:inline-block}
.board .flakes span.on{background:var(--sugar)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:4px;margin:0 0 10px}
.mode button{border:0;background:transparent;border-radius:999px;min-height:40px;font-weight:800;font-size:14px;color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.synchip{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:12.5px;padding:0 0 8px;cursor:pointer}
.synchip .led{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.synchip.cloud .led{background:var(--ok)} .synchip.device .led{background:var(--sugar)} .synchip.readonly .led{background:var(--bad)}
.next{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pepper);border-radius:var(--rs);padding:10px 12px;margin:0 0 2px;font-size:14px}
.next button{margin-left:auto;flex:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card > h2{font-size:18px;margin-bottom:4px}
h3{font-size:14.5px;margin:18px 0 8px;color:var(--ink)}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 16px;min-height:44px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,transform .06s}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--spruce);border-color:var(--spruce);color:var(--spruce-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--spruce);padding:0 8px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;margin:10px 0}
label.f .l{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--rs);padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
input[type=number]{width:84px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{background:var(--p1-soft);color:var(--pepper)} .pill.gold{background:var(--sugar);color:#2A1E05}
.pill.elf{color:var(--spruce)} .pill.reindeer{background:var(--frost);color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:none}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)}
.pts{font-family:"Alfa Slab One",serif;font-size:15px}
.pts.pos{color:var(--ok)} .pts.neg{color:var(--bad)} .pts.zero{color:var(--ink-2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:48px;height:48px;font-size:15px} .av.xl{width:68px;height:68px;font-size:20px}
.av.elf{background:var(--surface-2);color:var(--spruce)} .av.reindeer{background:var(--frost)}
.av.ring-p1{box-shadow:0 0 0 2.5px var(--p1)} .av.ring-p2{box-shadow:0 0 0 2.5px var(--p2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:0 13px 0 5px;min-height:42px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;line-height:1.2;transition:background .12s,border-color .12s}
.chip.plain{padding-left:13px}
.chip[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--spruce-ink)}
.chip[aria-pressed="true"] .av{box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.chip.tid{background:var(--surface-2);border-color:transparent;padding-left:13px}
.chip.tid[aria-pressed="true"]{background:var(--pepper);border-color:var(--pepper);color:var(--pepper-ink)}
.chip.yn{min-width:60px;justify-content:center;padding:0 14px}
.chip:disabled{opacity:.4;cursor:not-allowed}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-weight:800;font-size:14px;padding:0;margin-bottom:2px}
legend .hint{font-weight:600;color:var(--ink-2);font-size:12px;margin-left:6px}
details.fold{margin-top:10px} details.fold summary{cursor:pointer;font-weight:800;font-size:14.5px;color:var(--spruce);padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;line-height:1}
details.fold[open] summary::before{transform:rotate(90deg)}
.empty{padding:16px;border:1.5px dashed var(--line-strong);border-radius:var(--rs);text-align:center;color:var(--ink-2);font-size:14px}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px}
.steps li:first-child{border-top:0}
.steps .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.steps li.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done span.t{color:var(--ink-2);text-decoration:line-through}
.steps li .btn{margin-left:auto}

/* week */
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk-nav select{flex:1;min-height:40px;padding:6px 10px;font-size:14.5px;font-weight:700}
.wk-nav .btn{min-height:40px;width:40px;padding:0}
.wk-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.wk-head .wk{font-family:"Alfa Slab One",serif;color:var(--pepper);font-size:13px}
.wk-head h2{font-size:20px;flex-basis:100%;margin:0}
.wk-meta{font-size:13px;color:var(--ink-2)}
.chal{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.chal dt{font-weight:800;color:var(--ink-2)} .chal dd{margin:0}
.note{background:var(--surface-2);border-radius:var(--rs);padding:8px 12px;font-size:13.5px;margin:10px 0 0}

/* player cards */
.pc{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;background:var(--surface)}
.pc.p1{border-left:6px solid var(--p1)} .pc.p2{border-left:6px solid var(--p2)}
.pc-head{display:flex;align-items:center;gap:10px}
.pc-head strong{font-size:16.5px}
.pc-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.sumline{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin-top:10px}
.kv .k{color:var(--ink-2);font-weight:700}
.kv .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mask{letter-spacing:.2em;color:var(--ink-2)}
.hit{color:var(--ok);font-weight:800} .miss{color:var(--bad);font-weight:700}

/* picks sheet */
.sheet{border:2px solid var(--line-strong);border-radius:var(--r);background:var(--surface);margin:12px 0;overflow:hidden}
.sheet.p1{border-color:var(--p1)} .sheet.p2{border-color:var(--p2)}
.sh-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2)}
.sh-top h2{font-size:17px;margin:0;flex:1}
.sh-body{padding:0 14px 10px}
.sec{border-top:1px solid var(--line);padding:14px 0}
.sec:first-child{border-top:0}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h3{margin:0;font-size:15px;flex:1}
.sec .why{font-size:13px;color:var(--ink-2);margin:2px 0 4px}
.sh-foot{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.prop-q{font-weight:800;font-size:15px;margin:4px 0 6px}

/* score */
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media (max-width:440px){.sb-grid{grid-template-columns:1fr}}
.sb{border-radius:var(--rs);padding:10px 12px;background:var(--surface-2)}
.sb.p1{background:var(--p1-soft)} .sb.p2{background:var(--p2-soft)}
.sb .sbh{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:4px}
.sb .sbh .pts{font-size:22px}
.sb ul{list-style:none;margin:0;padding:0;font-size:13px}
.sb li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.sb li .pts{font-size:13px}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.log li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.log li .x{margin-left:auto}
.whobox{margin-top:8px;padding:10px;border-radius:var(--rs);background:var(--surface-2)}
.teamrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.teamrow .nm{flex:1;font-weight:700;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:34px;padding:0 12px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--spruce);color:var(--spruce-ink)}
.ep-list{list-style:none;margin:0;padding:0}
.ep-list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ep-list li:first-child{border-top:0}
.ep-list .wkn{font-family:"Alfa Slab One",serif;color:var(--ink-2);font-size:13px;width:36px;flex:none}
.ep-list .t{font-weight:800;line-height:1.2}
.ep-list .d{font-size:12px;color:var(--ink-2)}
.ep-list .r{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ep-list li.cur .t{color:var(--pepper)}

/* standings */
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:12px;color:var(--ink-2);text-align:right;font-weight:800;padding:6px;border-bottom:1px solid var(--line)}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td{padding:7px 6px;border-top:1px dashed var(--line);text-align:right;white-space:nowrap}
table.st tr.tot td{border-top:2px solid var(--line-strong);font-weight:800}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.roster{grid-template-columns:1fr}}
.rcol{border-radius:var(--rs);padding:10px;background:var(--surface-2)}
.rcol.p1{background:var(--p1-soft)} .rcol.p2{background:var(--p2-soft)}
.rcol strong{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.rrow .n{flex:1;line-height:1.15} .rrow .n small{display:block;color:var(--ink-2);font-size:11.5px}
.rrow.out .n{text-decoration:line-through;color:var(--ink-2)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:var(--rs);padding:10px 12px;font-size:13px}
.stat.p1{background:var(--p1-soft)} .stat.p2{background:var(--p2-soft)}
.stat strong{display:block;margin-bottom:4px}
.stat div{display:flex;justify-content:space-between;padding:2px 0}

/* draft */
.draft-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.draft-col{border-radius:var(--rs);padding:10px}
.draft-col.p1{background:var(--p1-soft)} .draft-col.p2{background:var(--p2-soft)}
.draft-col strong{display:block;margin-bottom:4px}
.draft-col ol{margin:0;padding-left:18px;font-size:14px}
.clock{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-weight:800}
.clock .who{font-family:"Alfa Slab One",serif;font-size:20px}

/* cast editor */
.cast-row{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.cast-row:first-of-type{border-top:0}
.cast-row .ph{display:flex;flex-direction:column;gap:6px;align-items:center}
.cast-row .ph label.btn{min-height:32px;padding:0 10px;font-size:12px}
.cast-row input[type=text]{font-size:14px;padding:8px 10px;min-height:40px;margin-top:6px}
.cast-row input[type=text]:first-child{margin-top:0;font-weight:800}
.cast-row .two{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.cast-row select{width:auto;min-height:36px;padding:6px 10px;font-size:13.5px}
.cast-row input[type=file]{display:none}
.rules table{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:7px 4px;border-top:1px dashed var(--line);vertical-align:top}
.rules td:last-child{text-align:right;white-space:nowrap}
.rules tr:first-child td{border-top:0}
.cfg-grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.tid-row{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:center;margin:6px 0}
.ep-row{border-top:1px dashed var(--line);padding:10px 0}
.status-line{display:flex;align-items:center;gap:8px;font-size:14px}
.status-line .led{width:10px;height:10px;border-radius:50%;background:var(--line-strong);flex:none}
.status-line .led.cloud{background:var(--ok)} .status-line .led.device{background:var(--sugar)} .status-line .led.readonly{background:var(--bad)}
.sources{font-size:12px;color:var(--ink-2)} .sources ul{margin:4px 0 0;padding-left:18px}
.danger-zone{border-color:var(--bad)}

/* nav + toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:transparent;color:var(--ink-2);font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--pepper)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:var(--board);color:var(--board-ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;transition:opacity .18s,transform .18s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

function castBakers(){ return CAST.map((c,i)=>({id:'b'+(i+1),name:c[0],note:c[1],team:'tba',owner:null,photo:CAST_PHOTOS[i]?'cast:'+i:null})); }
function castPhotoFor(b,i){ const k=CAST.findIndex(c=>c[0]===b.name); const j=k>-1?k:i; return CAST_PHOTOS[j]?'cast:'+j:null; }
function photoSrc(b){ if(!b||!b.photo) return null; if(typeof b.photo==='string'&&b.photo.startsWith('cast:')) return CAST_PHOTOS[+b.photo.slice(5)]||null; return b.photo; }
function defaultState(){
  return {version:1,schema:6,updatedAt:Date.now(),players:{p1:{name:'John'},p2:{name:'Player 2'}},bakers:castBakers(),draft:{first:null,picks:[],done:false},
    scoring:clone(DEFAULT_SCORING),tidbits:clone(DEFAULT_TIDBITS),bold:{p1:{winner:null,firstOut:null,finalists:[null,null,null]},p2:{winner:null,firstOut:null,finalists:[null,null,null]}},
    episodes:DEFAULT_EPISODES.map(mkEpisode)};
}
function ensureShape(x){
  if(!x.schema||x.schema<3){
    x.bakers.forEach((b,i)=>{ if((!b.name||!b.name.trim())&&CAST[i]){ b.name=CAST[i][0]; if(!b.note) b.note=CAST[i][1]; } });
    const played=x.episodes.some(e=>e.finalized||e.results.out.length||e.results.mainWin);
    if(!played){ x.draft={first:null,picks:[],done:false}; x.bakers.forEach(b=>b.owner=null); x.episodes.forEach(e=>{ for(const p of P) e.picks[p]=blankPicks(); }); }
    x.schema=3; x.updatedAt=Date.now();
  }
  if(x.schema<4){ x.bakers.forEach((b,i)=>{ if(!b.photo) b.photo=castPhotoFor(b,i); }); x.schema=4; x.updatedAt=Date.now(); }
  if(x.schema<5){ x.bakers.forEach(b=>{ const k=CAST_PHOTOS.indexOf(b.photo); if(k>-1) b.photo='cast:'+k; }); x.schema=5; x.updatedAt=Date.now(); }
  if(x.schema<6){ const used=new Set(x.draft.picks); x.episodes.forEach(e=>{ const r=e.results; [r.preheatWin,r.mainWin,r.champion,...r.preheatTop,...r.mainTop,...r.mainBottom,...r.out].forEach(id=>id&&used.add(id)); r.tidbits.forEach(t=>used.add(t.b)); for(const p of P){ const pk=e.picks[p]; ['preheat','main','out','captain','streak'].forEach(k=>pk[k]&&used.add(pk[k])); } }); for(const p of P){ const bo=x.bold[p]; [bo.winner,bo.firstOut,...bo.finalists].forEach(id=>id&&used.add(id)); } x.bakers=x.bakers.filter(b=>(b.name&&b.name.trim())||b.owner||used.has(b.id)); x.schema=6; x.updatedAt=Date.now(); }
  for(const k in DEFAULT_SCORING) if(typeof x.scoring[k]!=='number') x.scoring[k]=DEFAULT_SCORING[k];
  if(!Array.isArray(x.tidbits)||!x.tidbits.length) x.tidbits=clone(DEFAULT_TIDBITS);
  if(x.scoring.propHit===1&&!x.episodes.some(e=>e.finalized||e.results.out.length||e.results.mainWin)) x.scoring.propHit=DEFAULT_SCORING.propHit;
  x.bakers.forEach(b=>{ if(!('photo' in b)) b.photo=null; if(!('note' in b)) b.note=''; if(!b.team) b.team='tba'; });
  x.episodes.forEach((e,i)=>{ if(!Array.isArray(e.tids)) e.tids=clone((DEFAULT_EPISODES[i]||{}).tids||['t1','t2','t5']); if(!e.prop) e.prop=clone((DEFAULT_EPISODES[i]||{}).prop||{label:'Jesse springs a twist during the main heat',rule:null,tid:null}); if(!('prop' in e.results)) e.results.prop=null; if(!Array.isArray(e.results.tidbits)) e.results.tidbits=[]; for(const p of P){ const pk=e.picks[p]; if(!('captain' in pk)) pk.captain=null; if(!('streak' in pk)) pk.streak=null; if(!('prop' in pk)) pk.prop=null; } });
  return x;
}

/* ---------- persistence ---------- */
let S=null;
const ui={mode:'play',tab:'picks',ep:null,sheet:null,tidPending:null,sync:'checking',syncNote:'',lastSync:null};
const session=Math.random().toString(36).slice(2);
const HOSTED=!!(window.claude&&typeof window.claude.use==='function');
function validState(x){ return !!(x&&typeof x==='object'&&x.version===1&&Array.isArray(x.bakers)&&Array.isArray(x.episodes)&&x.players&&x.scoring); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(){ try{ const raw=lsGet(KEY); if(!raw) return null; const x=JSON.parse(raw); return validState(x)?ensureShape(x):null; }catch(e){ return null; } }
function persistLocal(){ lsSet(KEY,JSON.stringify(S)); }
let dbDoc=null,dbWritable=true,dbTimer=null,writeChain=Promise.resolve(),unsub=null;
function cloudBody(){ return clone({updatedAt:S.updatedAt,writer:session,state:S}); }
function writeNow(){ if(!dbDoc||!dbWritable) return; const body=cloudBody(); writeChain=writeChain.then(()=>dbDoc.set(body)).then(()=>{ ui.lastSync=Date.now(); if(ui.tab==='setup') render(); else renderSyncChip(); }).catch(e=>{ if(e&&['invalid_argument','not_granted','revoked','quota_exceeded'].includes(e.code)){ dbWritable=false; ui.sync=e.code==='quota_exceeded'?'device':'readonly'; ui.syncNote=e.code==='quota_exceeded'?'The cloud copy is full, so changes stay on this phone.':''; render(); } }); }
function pushCloud(){ if(!dbDoc||!dbWritable) return; clearTimeout(dbTimer); dbTimer=setTimeout(()=>{ dbTimer=null; writeNow(); },500); }
function flushCloud(){ if(dbTimer){ clearTimeout(dbTimer); dbTimer=null; writeNow(); } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushCloud(); });
window.addEventListener('pagehide',flushCloud);
function save(){ S.updatedAt=Date.now(); persistLocal(); pushCloud(); render(); }
function saveQuiet(){ S.updatedAt=Date.now(); persistLocal(); pushCloud(); renderBoard(); renderNext(); }
function adopt(x){ if(!validState(x)) return; x=ensureShape(x);
  if(S&&ui.sheet&&ui.ep!==null&&S.episodes[ui.ep]&&x.episodes[ui.ep]){ const mine=S.episodes[ui.ep].picks[ui.sheet],theirs=x.episodes[ui.ep].picks[ui.sheet]; if(mine&&theirs&&!theirs.locked&&!mine.locked) x.episodes[ui.ep].picks[ui.sheet]=clone(mine); }
  S=x; persistLocal(); render(); }
function subscribe(){ if(!dbDoc) return; if(unsub){ try{ unsub(); }catch(e){} } unsub=dbDoc.onSnapshot(sn=>{ if(!sn.exists) return; const d=sn.data(); if(!d||d.writer===session) return; if(d.state&&typeof d.updatedAt==='number'&&d.updatedAt>S.updatedAt){ adopt(clone(d.state)); ui.lastSync=Date.now(); toast('Updated from the other phone'); } },e=>{ unsub=null; if(e&&e.code==='revoked'){ ui.sync='device'; render(); return; } setTimeout(subscribe,6000); }); }
async function initCloud(){ try{
  if(!HOSTED){ ui.sync='local'; renderSyncChip(); return; }
  const db=await window.claude.use('db'); if(!db){ ui.sync='device'; renderSyncChip(); return; }
  dbDoc=db.doc('game/state');
  let canWrite=null; try{ const u=await window.claude.use('user'); if(u&&typeof u.can==='function') canWrite=await u.can('data.write'); }catch(e){}
  if(canWrite===false){ dbWritable=false; ui.sync='readonly'; } else { ui.sync='cloud'; }
  const snap=await dbDoc.get();
  if(snap.exists){ const d=snap.data(); if(d&&d.state&&typeof d.updatedAt==='number'&&d.updatedAt>S.updatedAt){ adopt(clone(d.state)); ui.lastSync=Date.now(); } else if(d&&typeof d.updatedAt==='number'&&d.updatedAt<S.updatedAt) pushCloud(); else ui.lastSync=Date.now(); }
  else pushCloud();
  subscribe(); render();
}catch(e){ ui.sync='device'; renderSyncChip(); } }

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const other=p=>p==='p1'?'p2':'p1';
const pname=p=>S.players[p].name||(p==='p1'?'Player 1':'Player 2');
const baker=id=>S.bakers.find(b=>b.id===id);
const bname=id=>{ const b=baker(id); if(!b) return '—'; return b.name||('Baker '+(S.bakers.indexOf(b)+1)); };
const first=id=>bname(id).split(/\s+/)[0];
const teamName=t=>t==='elf'?'Elf Squad':(t==='reindeer'?'Reindeer Crew':'Team TBA');
function initials(n){ const w=n.replace(/[“"'][^”"']*[”"']/g,'').replace(/[()]/g,'').split(/\s+/).filter(x=>/^[A-Za-z]/.test(x)); return (w.slice(0,2).map(x=>x[0].toUpperCase()).join(''))||'?'; }
function avatar(b,size,ring){ if(!b) return ''; const cls='av '+(size||'')+' '+b.team+(ring&&b.owner?' ring-'+b.owner:''); const src=photoSrc(b); return src?'<span class="'+cls+'"><img src="'+src+'" alt=""></span>':'<span class="'+cls+'">'+esc(initials(bname(b.id)))+'</span>'; }
function elimEp(id){ for(let i=0;i<S.episodes.length;i++){ if(S.episodes[i].results.out.includes(id)) return i; } return null; }
function activeAt(i){ return S.bakers.filter(b=>{ const e=elimEp(b.id); return e===null||e>=i; }); }
function champion(){ for(const ep of S.episodes){ if(ep.results.champion) return ep.results.champion; } return null; }
function hasResults(ep){ const r=ep.results; return !!(r.preheatWin||r.mainWin||r.out.length||r.teamWin||r.champion||r.preheatTop.length||r.mainTop.length||r.mainBottom.length||r.tidbits.length||r.prop); }
function scoredEp(ep){ return ep.results.out.length>0||ep.finalized; }
function epStatus(ep){ if(ep.finalized) return 'done'; if(hasResults(ep)) return 'scoring'; if(ep.picks.p1.locked||ep.picks.p2.locked) return 'picks'; return 'upcoming'; }
function currentEpIndex(){ const i=S.episodes.findIndex(e=>!e.finalized); return i===-1?S.episodes.length-1:i; }
function rosterReady(){ return S.draft.done&&S.bakers.length>0&&S.bakers.every(b=>b.owner); }
function playersNamed(){ return !!(S.players.p1.name&&S.players.p2.name&&S.players.p2.name!=='Player 2'); }
function fmt(n){ return (n>0?'+':'')+n; }
function pcls(n){ return n>0?'pos':(n<0?'neg':'zero'); }
function sum(lines){ return lines.reduce((a,l)=>a+l.pts,0); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function usedStreak(p,upto){ const u=[]; for(let i=0;i<upto;i++){ const s=S.episodes[i].picks[p].streak; if(s) u.push(s); } return u; }
function streakAt(p,i){ let n=0; for(let k=i;k>=0;k--){ const e=S.episodes[k],s=e.picks[p]; if(!s.locked||!s.streak||!scoredEp(e)) break; if(e.results.out.includes(s.streak)) break; n++; } return n; }
function resolveProp(ep){ const q=ep.prop||{}; const m=ep.results.prop; if(m==='yes'||m==='no') return m; const r=ep.results; if(!scoredEp(ep)) return null;
  if(q.rule==='sameWinner') return (r.preheatWin&&r.preheatWin===r.mainWin)?'yes':'no';
  if(q.rule==='preheatTeamWins'){ const b=baker(r.preheatWin); if(!b||!r.teamWin||b.team==='tba') return null; return b.team===r.teamWin?'yes':'no'; }
  if(q.rule==='preheatChamp') return r.champion?((r.preheatWin&&r.preheatWin===r.champion)?'yes':'no'):null;
  if(q.tid) return r.tidbits.some(t=>t.t===q.tid)?'yes':'no';
  return null; }
function callsMade(pk){ return ['preheat','main','out'].filter(k=>pk[k]).length; }

/* ---------- scoring ---------- */
function epPoints(i){
  const ep=S.episodes[i],r=ep.results,sc=S.scoring,out={p1:[],p2:[]},active=activeAt(i),scored=scoredEp(ep),byB={};
  for(const b of active){ const o=b.owner; if(!o) continue; const L=[],nm=first(b.id);
    if(ep.teamPhase&&r.teamWin&&b.team===r.teamWin) L.push({b:b.id,label:nm+' on the winning team',pts:sc.teamWin});
    if(r.preheatWin===b.id) L.push({b:b.id,label:nm+' wins the preheat',pts:sc.preheatWin}); else if(r.preheatTop.includes(b.id)) L.push({b:b.id,label:nm+' is a preheat favorite',pts:sc.preheatTop});
    if(r.mainWin===b.id) L.push({b:b.id,label:nm+' wins the main heat',pts:sc.mainWin}); else if(r.mainTop.includes(b.id)) L.push({b:b.id,label:nm+' is a top bake',pts:sc.mainTop});
    if(r.mainBottom.includes(b.id)) L.push({b:b.id,label:nm+' lands in the bottom',pts:sc.mainBottom});
    if(r.out.includes(b.id)) L.push({b:b.id,label:nm+' is sent home',pts:sc.out}); else if(scored) L.push({b:b.id,label:nm+' survives',pts:sc.survive});
    if(r.champion===b.id) L.push({b:b.id,label:nm+' is the champion!',pts:sc.champion});
    for(const t of r.tidbits){ if(t.b!==b.id) continue; const td=S.tidbits.find(x=>x.id===t.t); if(td) L.push({b:b.id,label:nm+': '+td.label,pts:td.pts}); }
    byB[b.id]=L; out[o].push(...L); }
  for(const p of P){ const pk=ep.picks[p]; if(!pk.locked) continue; const L=out[p];
    if(pk.captain&&byB[pk.captain]&&byB[pk.captain].length){ const cb=baker(pk.captain); if(cb&&cb.owner===p) L.push({b:pk.captain,label:'Captain ×2: '+first(pk.captain),pts:sum(byB[pk.captain])}); }
    let hits=0;
    if(pk.preheat&&r.preheatWin&&pk.preheat===r.preheatWin){ L.push({label:'Called the preheat winner',pts:sc.predPreheat}); hits++; }
    if(pk.main&&r.mainWin&&pk.main===r.mainWin){ L.push({label:'Called the main heat winner',pts:sc.predMain}); hits++; }
    if(pk.out&&r.out.includes(pk.out)){ L.push({label:'Called who goes home',pts:sc.predOut}); hits++; }
    if(hits===3) L.push({label:'Perfect week!',pts:sc.perfectWeek});
    if(pk.streak&&scored&&!r.out.includes(pk.streak)){ L.push({label:'Safe pick '+first(pk.streak)+' survives',pts:sc.streakHit}); const n=streakAt(p,i); if(n>0&&n%3===0) L.push({label:n+' safe picks in a row!',pts:sc.streakBonus}); }
    if(pk.prop){ const res=resolveProp(ep); if(res&&res===pk.prop) L.push({label:'Prop of the week: called it',pts:sc.propHit}); } }
  return out;
}
function seasonBonus(){ const out={p1:[],p2:[]},sc=S.scoring,ch=champion(),fo=S.episodes[0]&&S.episodes[0].results.out,lastIdx=S.episodes.length-1;
  for(const p of P){ const b=S.bold[p]; if(ch&&b.winner===ch) out[p].push({label:'Bold call: picked '+first(ch)+' to win it all',pts:sc.boldWinner}); if(fo&&fo.length&&b.firstOut&&fo.includes(b.firstOut)) out[p].push({label:'Bold call: picked '+first(b.firstOut)+' as first out',pts:sc.boldFirstOut}); if(ch){ const fin=activeAt(lastIdx).map(x=>x.id); for(const f of b.finalists){ if(f&&fin.includes(f)) out[p].push({label:'Bold call: '+first(f)+' made the finale',pts:sc.boldFinalist}); } } }
  return out; }
function totals(){ const t={p1:0,p2:0}; S.episodes.forEach((e,i)=>{ const pts=epPoints(i); t.p1+=sum(pts.p1); t.p2+=sum(pts.p2); }); const sb=seasonBonus(); t.p1+=sum(sb.p1); t.p2+=sum(sb.p2); return t; }
function bakerPoints(id){ let n=0; const b=baker(id); if(!b||!b.owner) return 0; S.episodes.forEach((e,i)=>{ for(const l of epPoints(i)[b.owner]){ if(l.b===id) n+=l.pts; } }); return n; }

/* ---------- next step ---------- */
function nextStep(){
  if(!rosterReady()) return {msg:'Set up the league: name the players and draft your bakers.',mode:'play',tab:'picks',cta:'Set up'};
  const i=currentEpIndex(),ep=S.episodes[i];
  if(ep.finalized) return {msg:'Season scored. Enjoy the bragging rights.',mode:'play',tab:'standings',cta:'Standings'};
  const both=ep.picks.p1.locked&&ep.picks.p2.locked;
  if(!both&&!hasResults(ep)){ const who=P.filter(p=>!ep.picks[p].locked).map(pname); return {msg:'Week '+ep.n+': '+who.join(' and ')+(who.length>1?' need':' needs')+' to lock picks before you press play.',mode:'play',tab:'picks',cta:'Picks'}; }
  if(ep.teamPhase&&activeAt(i).some(b=>b.team==='tba')) return {msg:'Week '+ep.n+': set each baker’s team once Jesse announces them.',mode:'admin',tab:'cast',cta:'Set teams'};
  return {msg:'Week '+ep.n+': keep score while you watch, then finalize.',mode:'admin',tab:'score',cta:'Keep score'};
}

   +'<div class="wk-head"><span class="wk">Week '+ep.n+' of '+S.episodes.length+'</span>'+pill+'<span class="wk-meta">'+esc(ep.date)+(ep.expected?' (expected)':'')+'</span><h2 class="display">'+esc(ep.title)+'</h2></div><dl class="chal"><dt>Preheat</dt><dd>'+esc(ep.preheat)+'</dd><dt>Main heat</dt><dd>'+esc(ep.main)+'</dd></dl>'+(ep.note?'<p class="note">'+esc(ep.note)+'</p>':''); }

/* ===== PLAY: picks ===== */

  if(ui.ep===null) ui.ep=currentEpIndex();
  const i=ui.ep,ep=S.episodes[i];
  if(!rosterReady()) return viewOnboarding();

  let h='<section class="card">'+weekHeader(ep,i);
  const active=activeAt(i); if(!active.length) return h+'</section>';

  h+='<p class="small muted" style="margin:12px 0 0">Make your picks one at a time and lock before you press play. They stay hidden until both of you lock.</p>';
  for(const p of P) h+=playerCard(p,ep,i,revealed);
  return h+'</section>';
}
function viewOnboarding(){

  let h='<section class="card"><h2 class="display">Set up your league</h2><p class="small muted">Three steps, once. After this the Picks tab is just the week’s picks.</p><ol class="steps">';
  h+='<li class="'+(named?'done':'')+'"><span class="chk">'+(named?'✓':'1')+'</span><span class="t">Name the players</span>'+(named?'':'<button class="btn sm" data-action="goto" data-mode="admin" data-tab="setup">Names</button>')+'</li>';
  h+='<li class="'+(drafted?'done':'')+'"><span class="chk">'+(drafted?'✓':'2')+'</span><span class="t">Draft the 12 bakers</span></li>';
  h+='<li><span class="chk">3</span><span class="t">Lock in rosters, then make week 1 picks</span></li></ol></section>';

  h+='<p class="tiny muted" style="margin-top:12px">Need to add or remove a baker? That lives under Setup, so it can’t happen by accident.</p></section>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const nav=e.target.closest('nav.tabs button'); if(nav){ setTab(nav.dataset.tab); return; }
  const mode=e.target.closest('.mode button'); if(mode){ setMode(mode.dataset.mode); return; }
  const el=e.target.closest('[data-action]'); if(!el) return;
  if(['INPUT','SELECT','TEXTAREA','LABEL'].includes(el.tagName)) return;
  const a=el.dataset.action,ep=ui.ep!==null?S.episodes[ui.ep]:null;
  switch(a){
    case 'goto': setMode(el.dataset.mode,el.dataset.tab); return;
    case 'open-ep': ui.ep=+el.dataset.i; ui.tidPending=null; ui.sheet=null; render(); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'ep-prev': if(ui.ep>0){ ui.ep--; ui.sheet=null; ui.tidPending=null; render(); } return;
    case 'ep-next': if(ui.ep<S.episodes.length-1){ ui.ep++; ui.sheet=null; ui.tidPending=null; render(); } return;
    case 'open-sheet': ui.sheet=el.dataset.p; render(); window.scrollTo({top:0}); return;
    case 'close-sheet': ui.sheet=null; render(); return;
    case 'pk': { const p=ui.sheet; if(!p) return; const pk=ep.picks[p],f=el.dataset.field,id=el.dataset.id; pk[f]=pk[f]===id?null:id; save(); return; }
    case 'pk-prop': { const p=ui.sheet; if(!p) return; const pk=ep.picks[p]; pk.prop=pk.prop===el.dataset.v?null:el.dataset.v; save(); return; }
    case 'lock': { const p=el.dataset.p,pk=ep.picks[p]; if(callsMade(pk)<3&&!confirm('Only '+callsMade(pk)+' of 3 calls made. Lock anyway?')) return; pk.locked=true; ui.sheet=null; save(); toast(pname(p)+'’s picks are locked'); window.scrollTo({top:0}); return; }
    case 'unlock': { const p=el.dataset.p; if(hasResults(ep)&&!confirm('Scoring has started. Unlock anyway?')) return; ep.picks[p].locked=false; save(); return; }
    case 'res': { if(ep.finalized) return; const f=el.dataset.field,id=el.dataset.id,single=el.dataset.single==='1',r=ep.results; if(single) r[f]=r[f]===id?null:id; else { const k=r[f].indexOf(id); if(k===-1) r[f].push(id); else r[f].splice(k,1); } if(f==='preheatWin'&&id) r.preheatTop=r.preheatTop.filter(x=>x!==id); if(f==='mainWin'&&id){ r.mainTop=r.mainTop.filter(x=>x!==id); r.mainBottom=r.mainBottom.filter(x=>x!==id); } save(); return; }
    case 'res-prop': { if(ep.finalized) return; ep.results.prop=el.dataset.v==='auto'?null:el.dataset.v; save(); return; }
    case 'ep-tid': { const e=S.episodes[+el.dataset.i]; e.tids=e.tids||[]; const id=el.dataset.id,k=e.tids.indexOf(id); if(k>-1) e.tids.splice(k,1); else { if(e.tids.length>=3){ toast('Three per week, swap one out first'); return; } e.tids.push(id); } save(); return; }
    case 'team': { const b=baker(el.dataset.id); if(!b) return; b.team=b.team===el.dataset.t?'tba':el.dataset.t; save(); return; }
    case 'tid': { if(ep.finalized) return; ui.tidPending=ui.tidPending===el.dataset.id?null:el.dataset.id; render(); return; }
    case 'tid-who': { if(!ui.tidPending) return; ep.results.tidbits.push({t:ui.tidPending,b:el.dataset.id}); const td=S.tidbits.find(t=>t.id===ui.tidPending); ui.tidPending=null; save(); toast(first(el.dataset.id)+': '+(td?td.label:'')); return; }
    case 'tid-cancel': ui.tidPending=null; render(); return;
    case 'tid-rm': ep.results.tidbits.splice(+el.dataset.k,1); save(); return;
    case 'finalize': { if(!hasResults(ep)) return; if(!ep.results.out.length&&!confirm('Nobody marked as sent home. Finalize anyway?')) return; ep.finalized=true; ui.tidPending=null; save(); toast('Week '+ep.n+' is final'); const n=currentEpIndex(); if(n!==ui.ep){ ui.ep=n; render(); window.scrollTo({top:0,behavior:'smooth'}); } return; }
    case 'reopen': if(confirm('Reopen week '+ep.n+' for edits?')){ ep.finalized=false; save(); } return;
    case 'flip': S.draft.first=Math.random()<0.5?'p1':'p2'; save(); toast(pname(S.draft.first)+' picks first'); return;
    case 'draft-pick': { const seq=draftSeq(),k=S.draft.picks.length; if(k>=S.bakers.length) return; const b=baker(el.dataset.id); if(!b||S.draft.picks.includes(b.id)) return; b.owner=seq[k]; S.draft.picks.push(b.id); save(); return; }
    case 'draft-undo': { const id=S.draft.picks.pop(),b=baker(id); if(b) b.owner=null; save(); return; }
    case 'draft-reset': if(confirm('Clear all picks and start the draft over?')){ S.draft={first:null,picks:[],done:false}; S.bakers.forEach(b=>b.owner=null); save(); } return;
    case 'draft-finish': S.draft.done=true; ui.ep=currentEpIndex(); save(); toast('Rosters locked in'); return;
    case 'draft-reopen': if(confirm('Redo the draft? Current rosters will be cleared.')){ S.draft={first:null,picks:[],done:false}; S.bakers.forEach(b=>b.owner=null); save(); setMode('play','picks'); } return;
    case 'bk-add': { if(!confirm('Add a 13th slot? The real cast is 12.')) return; let n=1; while(S.bakers.some(b=>b.id==='b'+n)) n++; S.bakers.push({id:'b'+n,name:'New baker',note:'',team:'tba',owner:null,photo:null}); save(); return; }
    case 'bk-rm': { const b=baker(el.dataset.id); if(!b) return; if(!confirm('Remove '+bname(b.id)+' from the game? Any points tied to them disappear.')) return; removeBaker(b.id); save(); toast(bname(b.id)+' removed'); return; }
    case 'bk-photo-rm': { const b=baker(el.dataset.id); if(b){ b.photo=null; save(); } return; }
    case 'scoring-reset': S.scoring=clone(DEFAULT_SCORING); save(); toast('Point values reset'); return;
    case 'tid-add': { let n=1; while(S.tidbits.some(t=>t.id==='t'+n)) n++; S.tidbits.push({id:'t'+n,label:'New tidbit',pts:1}); save(); return; }
    case 'tid-del': { const id=el.dataset.id; if(S.episodes.some(e=>e.results.tidbits.some(t=>t.t===id))&&!confirm('This tidbit has been logged this season. Remove it and its points?')) return; S.tidbits=S.tidbits.filter(t=>t.id!==id); for(const e of S.episodes){ e.results.tidbits=e.results.tidbits.filter(t=>t.t!==id); if(e.prop&&e.prop.tid===id) e.prop.tid=null; } save(); return; }
    case 'ep-add': { const n=S.episodes.length+1; S.episodes.push(mkEpisode({n,title:'Week '+n+' (title TBA)',date:'TBA',expected:true,teamPhase:false,preheat:'TBA',main:'TBA',note:'',prop:{label:'Jesse springs a twist during the main heat',rule:null,tid:null}})); save(); return; }
    case 'ep-rm': { if(S.episodes.length<=1) return; const last=S.episodes[S.episodes.length-1]; if((hasResults(last)||last.finalized)&&!confirm('Week '+last.n+' has scores. Remove it anyway?')) return; S.episodes.pop(); if(ui.ep!==null&&ui.ep>=S.episodes.length) ui.ep=null; save(); return; }
    case 'backup-copy': copyText('HBC13:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))); return;
    case 'restore': { const box=document.getElementById('restore-box'); let raw=(box.value||'').trim(); if(!raw){ toast('Paste a backup code first'); return; } if(raw.startsWith('HBC13:')) raw=raw.slice(6); try{ const x=JSON.parse(decodeURIComponent(escape(atob(raw)))); if(!validState(x)) throw new Error('bad'); if(!confirm('Replace everything here with the backup? This can’t be undone.')) return; S=ensureShape(x); ui.ep=null; ui.sheet=null; save(); toast('Restored'); }catch(err){ toast('That code didn’t work. Check you copied all of it.'); } return; }
    case 'reset-all': if(confirm('Wipe the season and start from scratch?')){ S=defaultState(); ui.ep=null; ui.sheet=null; save(); toast('Fresh season'); } return;
    case 'theme': lsSet('hbc13-theme',el.dataset.v); applyTheme(); render(); return;
    case 'send-link': { packState().then(code=>{ const url=gameLink(code); if(navigator.share){ navigator.share({title:'Fantasy Holiday Baking Championship',text:'Latest game. Tap to load it on your phone.',url}).catch(()=>{}); } else if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>toast('Link copied. Text it to the other phone.')).catch(()=>toast('Couldn’t copy the link')); } else toast('Sharing isn’t available in this browser'); }); return; }
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return; const a=el.dataset.action;
  switch(a){
    case 'ep-sel': ui.ep=+el.value; ui.sheet=null; ui.tidPending=null; render(); return;
    case 'bold': { const b=S.bold[el.dataset.p]; if(el.dataset.field==='finalists') b.finalists[+el.dataset.idx]=el.value||null; else b[el.dataset.field]=el.value||null; saveQuiet(); return; }
    case 'bk-name': baker(el.dataset.id).name=el.value.trim(); saveQuiet(); return;
    case 'bk-note': baker(el.dataset.id).note=el.value.trim(); saveQuiet(); return;
    case 'bk-owner': baker(el.dataset.id).owner=el.value||null; save(); return;
    case 'bk-photo': { const f=el.files&&el.files[0]; if(f) readPhoto(f).then(d=>{ const b=baker(el.dataset.id); if(b){ b.photo=d; save(); toast('Photo added'); } }).catch(()=>toast('Couldn’t read that image')); return; }
    case 'bk-photos': { const files=Array.from(el.files||[]); if(!files.length) return; files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})); const targets=S.bakers.slice(0,files.length); toast('Adding '+files.length+' photos…'); Promise.all(files.map(f=>readPhoto(f).catch(()=>null))).then(ds=>{ let n=0; ds.forEach((d,k)=>{ if(d&&targets[k]){ targets[k].photo=d; n++; } }); save(); toast(n+' photos added'+(files.length>S.bakers.length?' (extras ignored)':'')); }); return; }
    case 'pname': S.players[el.dataset.p].name=el.value.trim(); saveQuiet(); return;
    case 'scoring': { const v=parseInt(el.value,10); if(Number.isFinite(v)) S.scoring[el.dataset.k]=v; saveQuiet(); return; }
    case 'tid-label': { const t=S.tidbits.find(x=>x.id===el.dataset.id); if(t) t.label=el.value.trim()||t.label; saveQuiet(); return; }
    case 'tid-pts': { const t=S.tidbits.find(x=>x.id===el.dataset.id),v=parseInt(el.value,10); if(t&&Number.isFinite(v)) t.pts=v; saveQuiet(); return; }
    case 'ep': S.episodes[+el.dataset.i][el.dataset.k]=el.value.trim(); saveQuiet(); return;
    case 'ep-prop': { const e=S.episodes[+el.dataset.i]; e.prop=e.prop||{label:'',rule:null,tid:null}; e.prop.label=el.value.trim(); saveQuiet(); return; }
    case 'ep-prop-rule': { const e=S.episodes[+el.dataset.i]; e.prop=e.prop||{label:'',rule:null,tid:null}; const v=el.value; e.prop.rule=null; e.prop.tid=null; if(v.startsWith('rule:')) e.prop.rule=v.slice(5); else if(v.startsWith('tid:')) e.prop.tid=v.slice(4); saveQuiet(); return; }
    case 'ep-team': S.episodes[+el.dataset.i].teamPhase=el.checked; saveQuiet(); return;
    case 'ep-exp': S.episodes[+el.dataset.i].expected=el.checked; saveQuiet(); return;
  }
});
function removeBaker(id){ S.bakers=S.bakers.filter(x=>x.id!==id); S.draft.picks=S.draft.picks.filter(x=>x!==id); for(const e of S.episodes){ const r=e.results; for(const k of ['preheatTop','mainTop','mainBottom','out']) r[k]=r[k].filter(x=>x!==id); for(const k of ['preheatWin','mainWin','champion']) if(r[k]===id) r[k]=null; r.tidbits=r.tidbits.filter(t=>t.b!==id); for(const p of P){ const pk=e.picks[p]; for(const k of ['preheat','main','out','captain','streak']) if(pk[k]===id) pk[k]=null; } } for(const p of P){ const bo=S.bold[p]; if(bo.winner===id) bo.winner=null; if(bo.firstOut===id) bo.firstOut=null; bo.finalists=bo.finalists.map(x=>x===id?null:x); } }
function readPhoto(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file),img=new Image(); img.onload=()=>{ try{ const s=144,c=document.createElement('canvas'); c.width=s; c.height=s; const ctx=c.getContext('2d'),m=Math.min(img.naturalWidth,img.naturalHeight); ctx.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)*0.35,m,m,0,0,s,s); let d=c.toDataURL('image/jpeg',0.8); if(d.length>26000) d=c.toDataURL('image/jpeg',0.62); res(d); }catch(err){ rej(err); } URL.revokeObjectURL(url); }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('read')); }; img.src=url; }); }
function b64url(u8){ let t=''; for(let i=0;i<u8.length;i++) t+=String.fromCharCode(u8[i]); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const bin=atob(t),u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
async function packState(){ const bytes=new TextEncoder().encode(JSON.stringify(S)); try{ if(window.CompressionStream){ const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter(); w.write(bytes); w.close(); const buf=await new Response(cs.readable).arrayBuffer(); return 'z'+b64url(new Uint8Array(buf)); } }catch(e){} return 'p'+b64url(bytes); }
async function unpackState(str){ const kind=str[0],bytes=unb64url(str.slice(1)); if(kind==='z'){ const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter(); w.write(bytes); w.close(); const buf=await new Response(ds.readable).arrayBuffer(); return JSON.parse(new TextDecoder().decode(buf)); } return JSON.parse(new TextDecoder().decode(bytes)); }
function gameLink(code){ return location.origin+location.pathname+'#g='+code; }
function receiveLink(){ const h=location.hash||''; if(!h.startsWith('#g=')) return false; const code=h.slice(3); try{ history.replaceState(null,'',location.pathname); }catch(e){} unpackState(code).then(x=>{ if(!validState(x)){ toast('That link didn’t contain a game'); return; } const inc=ensureShape(x); const older=inc.updatedAt<S.updatedAt; if(confirm(older?'This link is older than the game already on this phone. Load it anyway?':'Load the game from the other phone? It replaces what’s on this phone.')){ S=inc; persistLocal(); ui.ep=null; ui.sheet=null; render(); toast('Game loaded'); } }).catch(()=>toast('Couldn’t read that link')); return true; }
function copyText(text){ const done=()=>toast('Backup code copied'); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text)); } else fallbackCopy(text); }
function fallbackCopy(text){ const box=document.getElementById('restore-box'); if(box){ const d=box.closest('details'); if(d) d.open=true; box.value=text; box.focus(); box.select(); try{ document.execCommand('copy'); toast('Backup code copied'); }catch(e){ toast('Select the code in the box and copy it'); } } }
function setMode(m,tab){ if(!MODES[m]) m='play'; ui.mode=m; lsSet('hbc13-mode',m); setTab(tab&&MODES[m].includes(tab)?tab:MODES[m][0]); }
function setTab(t){ const m=Object.keys(MODES).find(k=>MODES[k].includes(t)); if(!m) t='picks'; ui.mode=m||'play'; ui.tab=t; ui.tidPending=null; ui.sheet=null; try{ history.replaceState(null,'','#'+t); }catch(e){} render(); window.scrollTo({top:0}); }
function themePref(){ return lsGet('hbc13-theme')||'auto'; }
function applyTheme(){ const v=themePref(); if(v==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); }
(function boot(){ S=load()||defaultState(); persistLocal(); applyTheme(); const h=(location.hash||'').replace('#',''); const m=Object.keys(MODES).find(k=>MODES[k].includes(h)); if(m){ ui.mode=m; ui.tab=h; } else { const sm=lsGet('hbc13-mode'); ui.mode=MODES[sm]?sm:'play'; ui.tab=MODES[ui.mode][0]; } ui.ep=currentEpIndex(); render(); initCloud(); receiveLink(); })();
</script>
